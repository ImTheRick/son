name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: upgrader-forge-1.12.2
          path: build/libs/*.jar
