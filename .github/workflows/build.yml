name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build --no-daemon --stacktrace
      - name: Inspect jars
        if: always()
        run: |
          ls -l build/libs || true
          for j in build/libs/*.jar; do
            echo "$j obfuscated-name hits: $(unzip -p "$j" net/execheinz/upgrader/UpgraderContainer.class | strings | grep -c func_)"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrader-forge-1.12.2
          path: build/libs/*.jar
